# Trimmed manifest for the bundler integration tests: only ts-sandbox + bundler, so the
# suite does not require building py-sandbox. Sources point at the artifacts produced by
# `spin build` against the main wasm/spin.toml. Used by test/integration-run.mjs.
spin_manifest_version = 2

[application]
name = "bundler-integration"
version = "0.1.0"

[variables]
log_level = { default = "info" }
# Tests use the public esm.sh; override with SPIN_VARIABLE_ESM_BASE_URL to test a self-hosted one.
esm_base_url = { default = "https://esm.sh" }

[[trigger.http]]
route = "/ts/..."
component = "ts-sandbox"
[component.ts-sandbox]
source = "../../../../dist/ts-sandbox.wasm"
key_value_stores = ["default"]
allowed_outbound_hosts = ["https://*:*", "http://*:*"]
[component.ts-sandbox.variables]
log_level = "{{ log_level }}"

[[trigger.http]]
route = "/bundle/..."
component = "bundler"
[component.bundler]
source = "../dist/bundler.wasm"
allowed_outbound_hosts = ["{{ esm_base_url }}"]
[component.bundler.variables]
esm_base_url = "{{ esm_base_url }}"
