spin_manifest_version = 2

[application]
name = "app-builder"
version = "0.1.0"
authors = ["Spin Sandbox"]
description = "App Builder: an LLM generates HTTP-handler web apps, stores them via @spinframework/sandbox, and serves each live at its own URL."

[variables]
log_level = { default = "info" }
# Where the model runs. Set it on `spin up`: SPIN_VARIABLE_MODEL_BASE_URL=<model-base-url>.
# Origin only (no path): it is also the api's outbound allow-list entry. The build profile only
# picks the API format: Anthropic Messages by default, OpenAI Responses with `--profile openai`.
model_base_url = { required = true }
model_api_key = { default = "", secret = true }
# Empty = the provider's default model.
model = { default = "" }
# Origin of the esm.sh server used by the experimental bundler. Defaults to the public
# https://esm.sh; to self-host, see https://github.com/esm-dev/esm.sh/blob/main/HOSTING.md and set
# SPIN_VARIABLE_ESM_BASE_URL=https://esm.example.com
esm_base_url = { default = "https://esm.sh" }
ts_interpreter_url = { default = "http://ts-sandbox.spin.internal" }
py_interpreter_url = { default = "http://py-sandbox.spin.internal" }
bundler_url = { default = "http://bundler.spin.internal" }
# Shared access token gating the UI + API. Empty = no gate (local dev); set to enable:
# SPIN_VARIABLE_ACCESS_TOKEN=some-secret
access_token = { default = "", secret = true }

[[trigger.http]]
route = "/..."
component = "ui"

[component.ui]
source = { url = "https://github.com/fermyon/spin-fileserver/releases/download/v0.3.0/spin_static_fs.wasm", digest = "sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148" }
files = [{ source = "ui/.output/public", destination = "/" }]
environment = { FALLBACK_PATH = "index.html" }
[component.ui.build]
command = "npm ci && npx nuxt generate"
workdir = "ui"

# The api component is reached from TWO routes: the control plane (/api/...) and the
# live-app surface (/a/...). Both hit the same api component; Hono routes internally.
[[trigger.http]]
route = "/api/..."
component = "api"

[[trigger.http]]
route = "/a/..."
component = "api"

[component.api]
source = "api/dist/api-anthropic.wasm"
# Reach the LLM, the two private interpreter components, and the bundler via service chaining.
# The api holds no KV of its own; code is stored in the sandbox's KV via the SDK.
allowed_outbound_hosts = [
  "{{ model_base_url }}",
  "http://ts-sandbox.spin.internal",
  "http://py-sandbox.spin.internal",
  "http://bundler.spin.internal",
]
[component.api.variables]
log_level = "{{ log_level }}"
model_base_url = "{{ model_base_url }}"
model_api_key = "{{ model_api_key }}"
model = "{{ model }}"
ts_interpreter_url = "{{ ts_interpreter_url }}"
py_interpreter_url = "{{ py_interpreter_url }}"
bundler_url = "{{ bundler_url }}"
access_token = "{{ access_token }}"
[component.api.build]
command = "npm run build:sdk && npm ci && LLM_PROVIDER=anthropic npm run build"
workdir = "api"
[component.api.profile.openai]
source = "api/dist/api-openai.wasm"
[component.api.profile.openai.build]
command = "npm run build:sdk && npm ci && LLM_PROVIDER=openai npm run build"

[[trigger.http]]
route = { private = true }
component = "ts-sandbox"

[component.ts-sandbox]
source = "../../dist/ts-sandbox.wasm"
exclude_files = ["**/node_modules"]
key_value_stores = ["default"]
# Broad dev outer bound for user code; the component's guard-io layer enforces the
# per-request allow-list on top. Tighten per deployment.
allowed_outbound_hosts = ["https://*:*", "http://*:*"]
[component.ts-sandbox.variables]
log_level = "{{ log_level }}"
[component.ts-sandbox.build]
command = "bash build-composed.sh"
workdir = "../../packages/typescript/sandbox"

[[trigger.http]]
route = { private = true }
component = "py-sandbox"

[component.py-sandbox]
source = "../../dist/py-sandbox.wasm"
key_value_stores = ["default"]
allowed_outbound_hosts = ["https://*:*", "http://*:*"]
[component.py-sandbox.build]
command = "bash build-composed.sh"
workdir = "../../py-sandbox"
watch = ["*.py", "requirements.txt"]

# EXPERIMENTAL private bundler for JavaScript npm dependencies. Apps with deps are bundled once
# at publish (KvCodeStore stores the self-contained blob) and served from it. It fetches deps
# from esm.sh (esm_base_url) and runs no user code, so it stays isolated from the
# code-executing sandboxes.
[[trigger.http]]
route = { private = true }
component = "bundler"

[component.bundler]
source = "../../packages/typescript/bundler/dist/bundler.wasm"
exclude_files = ["**/node_modules"]
allowed_outbound_hosts = ["{{ esm_base_url }}"]
[component.bundler.variables]
esm_base_url = "{{ esm_base_url }}"
[component.bundler.build]
command = "npm ci && npm run build"
workdir = "../../packages/typescript/bundler"
