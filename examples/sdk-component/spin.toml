spin_manifest_version = 2

[application]
name = "sandbox-sdk-component"
version = "0.1.0"
description = "Minimal Spin component using @spinframework/sandbox through private interpreter components."

[[trigger.http]]
route = "/..."
component = "api"

[component.api]
source = "api/dist/api.wasm"
allowed_outbound_hosts = [
  "http://ts-sandbox.spin.internal",
  "http://py-sandbox.spin.internal",
]
[component.api.build]
command = "npm run build:sdk && npm ci && npm run build"
workdir = "api"

[[trigger.http]]
route = { private = true }
component = "ts-sandbox"

[component.ts-sandbox]
source = "../../dist/ts-sandbox.wasm"
key_value_stores = ["default"]
allowed_outbound_hosts = ["https://*:*", "http://*:*"]

[[trigger.http]]
route = { private = true }
component = "py-sandbox"

[component.py-sandbox]
source = "../../dist/py-sandbox.wasm"
key_value_stores = ["default"]
allowed_outbound_hosts = ["https://*:*", "http://*:*"]