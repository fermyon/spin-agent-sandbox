spin_manifest_version = 2

[application]
name = "ai-code-executor"
version = "0.1.0"
authors = ["Spin Sandbox"]
description = "AI Code Executor: an LLM agent that runs model-written code in private, service-chained Wasm interpreter components."

[variables]
log_level = { default = "info" }
# The LLM provider is chosen at build time: Anthropic by default, OpenAI (or any server
# implementing the Responses API, e.g. Ollama) with `--profile openai`.
anthropic_api_key = { default = "", secret = true }
anthropic_base_url = { default = "https://api.anthropic.com" }
openai_api_key = { default = "", secret = true }
openai_base_url = { default = "https://api.openai.com" }
openai_api_path = { default = "/v1" }
# Empty = the provider's default model.
model = { default = "" }
ts_interpreter_url = { default = "http://ts-sandbox.spin.internal" }
py_interpreter_url = { default = "http://py-sandbox.spin.internal" }
bundler_url = { default = "http://bundler.spin.internal" }
# Shared access token gating the UI + API. Empty = no gate (local dev); set to enable:
# SPIN_VARIABLE_ACCESS_TOKEN=some-secret
access_token = { default = "", secret = true }

[[trigger.http]]
route = "/..."
component = "ui"

[component.ui]
source = { url = "https://github.com/fermyon/spin-fileserver/releases/download/v0.3.0/spin_static_fs.wasm", digest = "sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148" }
files = [{ source = "ui/.output/public", destination = "/" }]
environment = { FALLBACK_PATH = "index.html" }
[component.ui.build]
command = "npm install && npx nuxt generate"
workdir = "ui"

[[trigger.http]]
route = "/api/..."
component = "api"

[component.api]
source = "api/dist/api-anthropic.wasm"
# Reach the LLM, the two private interpreter components, and the bundler via service chaining
allowed_outbound_hosts = [
  "{{ anthropic_base_url }}",
  "{{ openai_base_url }}",
  "http://ts-sandbox.spin.internal",
  "http://py-sandbox.spin.internal",
  "http://bundler.spin.internal",
]
[component.api.variables]
log_level = "{{ log_level }}"
anthropic_api_key = "{{ anthropic_api_key }}"
anthropic_base_url = "{{ anthropic_base_url }}"
openai_api_key = "{{ openai_api_key }}"
openai_base_url = "{{ openai_base_url }}"
openai_api_path = "{{ openai_api_path }}"
model = "{{ model }}"
ts_interpreter_url = "{{ ts_interpreter_url }}"
py_interpreter_url = "{{ py_interpreter_url }}"
bundler_url = "{{ bundler_url }}"
access_token = "{{ access_token }}"
[component.api.build]
command = "npm install && LLM_PROVIDER=anthropic npm run build"
workdir = "api"
[component.api.profile.openai]
source = "api/dist/api-openai.wasm"
[component.api.profile.openai.build]
command = "npm install && LLM_PROVIDER=openai npm run build"

[[trigger.http]]
route = { private = true }
component = "ts-sandbox"

[component.ts-sandbox]
source = "../../dist/ts-sandbox.wasm"
exclude_files = ["**/node_modules"]
key_value_stores = ["default"]
# Broad dev outer bound for user code; the component's fetch shim enforces the
# per-request allow-list on top. Tighten per deployment.
allowed_outbound_hosts = ["https://*:*", "http://*:*"]
[component.ts-sandbox.variables]
log_level = "{{ log_level }}"
[component.ts-sandbox.build]
command = "bash build-composed.sh"
workdir = "../../packages/typescript/sandbox"

[[trigger.http]]
route = { private = true }
component = "py-sandbox"

[component.py-sandbox]
source = "../../dist/py-sandbox.wasm"
key_value_stores = ["default"]
allowed_outbound_hosts = ["https://*:*", "http://*:*"]
[component.py-sandbox.build]
command = "bash build-composed.sh"
workdir = "../../py-sandbox"
watch = ["*.py", "requirements.txt"]

# Private bundler for JavaScript npm dependencies: the SDK POSTs (source + package.json)
# here and runs the returned self-contained bundle. It fetches deps from esm.sh and runs no
# user code, so it stays isolated from the code-executing sandboxes.
[[trigger.http]]
route = { private = true }
component = "bundler"

[component.bundler]
source = "../../packages/typescript/bundler/dist/bundler.wasm"
exclude_files = ["**/node_modules"]
allowed_outbound_hosts = ["https://esm.sh", "https://*.esm.sh"]
[component.bundler.build]
command = "npm ci && npm run build"
workdir = "../../packages/typescript/bundler"
