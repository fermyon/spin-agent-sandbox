spin_manifest_version = 2

[application]
name = "spin-sandbox"
version = "0.1.0"

[variables]
log_level = { default = "info" }
# Origin of the esm.sh server used by the experimental bundler. Defaults to the public
# https://esm.sh; to self-host, see https://github.com/esm-dev/esm.sh/blob/main/HOSTING.md and set
# SPIN_VARIABLE_ESM_BASE_URL=https://esm.example.com
esm_base_url = { default = "https://esm.sh" }

# Development routes are public. Make sandbox components private in production.
[[trigger.http]]
route = "/ts/..."
component = "ts-sandbox"

[component.ts-sandbox]
source = "dist/ts-sandbox.wasm"
exclude_files = ["**/node_modules"]
# guard-io scopes this shared store by sandbox ID.
key_value_stores = ["default"]
# Wide-open egress is a development default; tighten it per deployment.
allowed_outbound_hosts = ["https://*:*", "http://*:*"]
[component.ts-sandbox.variables]
log_level = "{{log_level}}"
[component.ts-sandbox.build]
command = "bash build-composed.sh"
workdir = "packages/typescript/sandbox"
watch = [
    "crates/guard-io/src/**/*.rs", "crates/guard-io/Cargo.toml", "wit/**/*.wit",
    "crates/guard/src/**/*.rs", "crates/guard/Cargo.toml", "crates/guard/compose.wac",
    "packages/typescript/sandbox/src/**/*.ts",
]

# Bundles source and package.json into a self-contained artifact for ts-sandbox.
[[trigger.http]]
route = "/bundle/..."
component = "bundler"

[component.bundler]
source = "packages/typescript/bundler/dist/bundler.wasm"
exclude_files = ["**/node_modules"]
# EXPERIMENTAL. Bundler dependencies come only from esm.sh (esm_base_url).
allowed_outbound_hosts = ["{{ esm_base_url }}"]
[component.bundler.variables]
esm_base_url = "{{ esm_base_url }}"
[component.bundler.build]
command = "npm ci && npm run build"
workdir = "packages/typescript/bundler"

[[trigger.http]]
route = "/py/..."
component = "py-sandbox"

[component.py-sandbox]
source = "dist/py-sandbox.wasm"
key_value_stores = ["default"]
allowed_outbound_hosts = ["https://*:*", "http://*:*"]
[component.py-sandbox.build]
command = "bash build-composed.sh"
workdir = "py-sandbox"
watch = [
    "crates/guard-io/src/**/*.rs", "crates/guard-io/Cargo.toml", "wit/**/*.wit",
    "crates/guard/src/**/*.rs", "crates/guard/Cargo.toml", "crates/guard/compose-py.wac",
    "py-sandbox/**/*.py",
]
