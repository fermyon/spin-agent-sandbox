#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "{{project-name | kebab_case}}"
version = "0.1.0"
authors = ["{{authors}}"]
description = "{{project-description}}"

# Both components are prebuilt and pulled from the spin-agent-sandbox GitHub releases.
# To move to a newer release, update each source URL and digest.

# Both components are PRIVATE (no public route): they run untrusted code and are reachable
# only via service chaining from another component in this app. Add your own component that
# drives them through @spinframework/sandbox (see examples/ai-code-executor) and list
# "http://ts-sandbox.spin.internal" / "http://py-sandbox.spin.internal" in its
# `allowed_outbound_hosts`.

# ---------------------------------------------------------------------------
# TypeScript / JavaScript sandbox
# ---------------------------------------------------------------------------
[[trigger.http]]
route = { private = true }
component = "ts-sandbox"

[component.ts-sandbox]
source = { url = "https://github.com/fermyon/spin-agent-sandbox/releases/download/canary/ts-sandbox.wasm", digest = "sha256:5c815217be184d01ad9b1697273ae41dba22c8d1bb6fd47d831a2ebaf04fe30b" }
# Single shared KV store; the component scopes keys per sandbox id.
key_value_stores = ["default"]
# Outbound HTTP is denied until you list hosts here, e.g. ["https://api.example.com"]. Each
# request's `allowedHosts` can only narrow this list, and guard-io always refuses private and
# internal addresses.
allowed_outbound_hosts = []
[component.ts-sandbox.variables]
log_level = "info"

# ---------------------------------------------------------------------------
# Python sandbox
# ---------------------------------------------------------------------------
[[trigger.http]]
route = { private = true }
component = "py-sandbox"

[component.py-sandbox]
source = { url = "https://github.com/fermyon/spin-agent-sandbox/releases/download/canary/py-sandbox.wasm", digest = "sha256:9ab0826b16a066106caf0ef36823a901576eab2f0beb484c8e325deca79c4ad2" }
key_value_stores = ["default"]
# Outbound HTTP is denied until you list hosts here, e.g. ["https://api.example.com"]. Each
# request's `allowedHosts` can only narrow this list, and it always refuses private and
# internal addresses.
allowed_outbound_hosts = []
[component.py-sandbox.variables]
log_level = "info"
