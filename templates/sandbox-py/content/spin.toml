#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "{{project-name | kebab_case}}"
version = "0.1.0"
authors = ["{{authors}}"]
description = "{{project-description}}"

# PRIVATE component: it runs untrusted code, so it has no public route and is reachable
# only from other components in this app via service chaining. Add your own component that
# drives it through @spinframework/sandbox (see examples/ai-code-executor):
#
#   const py = new Interpreter({ baseUrl: "http://{{project-name | kebab_case}}.spin.internal" });
#
# Add "http://{{project-name | kebab_case}}.spin.internal" to that component's
# `allowed_outbound_hosts`.
[[trigger.http]]
route = { private = true }
component = "{{project-name | kebab_case}}"

[component.{{project-name | kebab_case}}]
# Prebuilt component from the spin-agent-sandbox GitHub releases. To move to a
# newer release, update the source URL and digest.
source = { url = "https://github.com/fermyon/spin-agent-sandbox/releases/download/canary/py-sandbox.wasm", digest = "sha256:9ab0826b16a066106caf0ef36823a901576eab2f0beb484c8e325deca79c4ad2" }
# The component scopes KV keys per sandboxId.
key_value_stores = ["default"]
# Outbound HTTP is denied until you list hosts here, e.g. ["https://api.example.com"]. Each
# request's `allowedHosts` can only narrow this list, and it always refuses private and
# internal addresses.
allowed_outbound_hosts = []
[component.{{project-name | kebab_case}}.variables]
log_level = "info"
