manifest_version = "1"
id = "sandbox-ts"
description = "JS/TS code sandbox with npm dependency support: a private code sandbox plus a private bundler, wired together"
trigger_type = "http"
tags = ["http", "sandbox", "ai", "javascript", "typescript", "bundler"]

# Enables `spin add -t sandbox-ts` into an existing app (in addition to `spin new`).
# In add mode the app-level files are skipped and only the two-component snippet is merged.
[add_component]
skip_files = ["spin.toml", ".gitignore"]
skip_parameters = ["project-description"]
[add_component.snippets]
component = "component.txt"

[parameters]
project-description = { type = "string", prompt = "Description", default = "" }
