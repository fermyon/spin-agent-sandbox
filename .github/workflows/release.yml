name: Release

# Tests and builds all three components, then publishes them as GitHub release assets so the
# Spin templates (templates/sandbox-*) can reference them by URL + digest.
#
#   - push a tag `vX.Y.Z`  -> a versioned release with that tag
#   - run manually         -> a rolling `canary` prerelease
#
# After a versioned release, run `scripts/update-template-refs.sh vX.Y.Z` to point the
# templates at it (fills in the real sha256 digests).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# New canary runs supersede older ones, even across branches. Versioned releases
# remain serialized per tag without cancelling an in-progress release.
concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || 'canary' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    with:
      run-integration: true

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create releases and (for canary) move the tag
    steps:
      - name: Checkout (with the spin-python-deps submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=canary" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Install Spin
        uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest Bytecode Alliance tools
        uses: ./.github/actions/setup-wasm-tools
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tested TypeScript components
        uses: actions/download-artifact@v4
        with:
          name: typescript-components
          path: _dist

      - name: Download compatibility reports from the tested run
        uses: actions/download-artifact@v4
        with:
          name: bundler-test-results
          path: _reports

      - name: Archive compatibility reports
        # A unique filename preserves reports across rolling canary releases.
        run: |
          tar -czf "_dist/compatibility-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz" -C _reports .

      - name: Build Python sandbox
        # py-sandbox/build.sh finds the prebuilt wasm32-wasi packages via the
        # spin-python-deps submodule (checked out above).
        # TS comes from the passing test workflow, including guard + guard-io composition.
        run: spin build -c py-sandbox

      - name: Collect artifacts and checksums
        run: |
          cp dist/py-sandbox.wasm _dist/py-sandbox.wasm
          wasm-tools validate _dist/py-sandbox.wasm
          ( cd _dist && sha256sum ts-sandbox.wasm py-sandbox.wasm bundler.wasm compatibility-*.tar.gz > "checksums-${RELEASE_VERSION}.txt" )
          cat "_dist/checksums-${RELEASE_VERSION}.txt"

      - name: Move canary tag
        if: env.PRERELEASE == 'true'
        run: |
          git tag -f canary
          git push -f origin canary

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            _dist/ts-sandbox.wasm
            _dist/py-sandbox.wasm
            _dist/bundler.wasm
            _dist/checksums-*.txt
            _dist/compatibility-*.tar.gz
