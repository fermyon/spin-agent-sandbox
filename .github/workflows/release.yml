name: Release

# Runs the full test workflow, then builds the three components from the same commit and
# publishes them, with the test run's bundler compatibility reports, as GitHub release
# assets so the Spin templates (templates/sandbox-*) can reference them by URL + digest.
#
#   - push a tag `vX.Y.Z`  -> a versioned release with that tag
#   - run manually         -> a rolling `canary` prerelease
#
# After a versioned release, run `scripts/update-template-refs.sh vX.Y.Z` to point the
# templates at it (fills in the real sha256 digests).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.95"

# New canary runs supersede older ones, even across branches. Versioned releases
# remain serialized per tag without cancelling an in-progress release.
concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || 'canary' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    with:
      run-bundler: true

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create releases and (for canary) move the tag
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=canary" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            packages/typescript/sandbox/package-lock.json
            packages/typescript/bundler/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain and Wasm targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update --target wasm32-wasip2
          rustup default "$RUST_VERSION"

      - name: Install Spin
        uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bytecode Alliance tools
        uses: ./.github/actions/setup-wasm-tools
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wasm-tools-version: "1.246.1"
          wac-version: "0.12.0"

      - name: Build components
        # The same commit the test workflow just passed.
        run: spin build

      - name: Validate components and their imports
        run: |
          wasm-tools validate dist/ts-sandbox.wasm
          wasm-tools validate dist/py-sandbox.wasm
          wasm-tools validate packages/typescript/bundler/dist/bundler.wasm
          node tests/check-imports.mjs

      - name: Download compatibility reports from the test run
        uses: actions/download-artifact@v4
        with:
          name: bundler-test-results
          path: _reports

      - name: Collect artifacts and checksums
        # A unique archive name preserves reports across rolling canary releases.
        run: |
          mkdir -p _dist
          cp dist/ts-sandbox.wasm dist/py-sandbox.wasm packages/typescript/bundler/dist/bundler.wasm _dist/
          tar -czf "_dist/compatibility-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz" -C _reports .
          ( cd _dist && sha256sum ts-sandbox.wasm py-sandbox.wasm bundler.wasm compatibility-*.tar.gz > "checksums-${RELEASE_VERSION}.txt" )
          cat "_dist/checksums-${RELEASE_VERSION}.txt"

      - name: Move canary tag
        if: env.PRERELEASE == 'true'
        run: |
          git tag -f canary
          git push -f origin canary

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            _dist/ts-sandbox.wasm
            _dist/py-sandbox.wasm
            _dist/bundler.wasm
            _dist/checksums-*.txt
            _dist/compatibility-*.tar.gz
