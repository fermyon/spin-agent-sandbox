name: Release

# Builds the two sandbox components and publishes them as GitHub release assets so the
# Spin templates (templates/sandbox-*) can reference them by URL + digest.
#
#   - push a tag `vX.Y.Z`  -> a versioned release with that tag
#   - run manually         -> a rolling `canary` prerelease
#
# After a versioned release, run `scripts/update-template-refs.sh vX.Y.Z` to point the
# templates at it (fills in the real sha256 digests).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create releases and (for canary) move the tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the spin-python-deps submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=canary" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Install Spin
        uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wasm-tools (py-sandbox/build.sh strips the component with it)
        run: |
          VER=1.245.1
          curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${VER}/wasm-tools-${VER}-x86_64-linux.tar.gz" | tar -xz
          echo "$PWD/wasm-tools-${VER}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Build components
        # py-sandbox/build.sh finds the prebuilt wasm32-wasi packages via the
        # spin-python-deps submodule (checked out above).
        run: spin build

      - name: Collect artifacts and checksums
        run: |
          mkdir -p _dist
          cp ts-sandbox/dist/ts-sandbox.wasm _dist/ts-sandbox.wasm
          cp py-sandbox/app.wasm             _dist/py-sandbox.wasm
          cp ts-sandbox/bundler/dist/bundler.wasm _dist/bundler.wasm
          ( cd _dist && sha256sum ts-sandbox.wasm py-sandbox.wasm bundler.wasm > "checksums-${RELEASE_VERSION}.txt" )
          echo "----- checksums -----"
          cat "_dist/checksums-${RELEASE_VERSION}.txt"

      - name: Move canary tag
        if: env.PRERELEASE == 'true'
        run: |
          git tag -f canary
          git push -f origin canary

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            _dist/ts-sandbox.wasm
            _dist/py-sandbox.wasm
            _dist/bundler.wasm
            _dist/checksums-*.txt
