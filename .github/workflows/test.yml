name: tests

# Two jobs: the pure-logic unit suites (no build, no server) and the live bundler
# integration (real Wasm components chained via `spin up`, reaching esm.sh). See
# packages/typescript/bundler/test/README.md. The broad 571-library compatibility sweep
# lives in packages/typescript/bundler/test/compat and is run manually.
on:
  push:
    branches: [main]
    paths:
      - "packages/typescript/**"
      - "py-sandbox/**"
      - "sdk/**"
      - "spin.toml"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "packages/typescript/**"
      - "py-sandbox/**"
      - "sdk/**"
      - "spin.toml"
      - ".github/workflows/test.yml"
  workflow_dispatch:


env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.95'

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The sdk runs its TypeScript tests directly (`node --test "test/*.test.ts"`),
          # which needs native type stripping (unflagged since Node 24) and --test glob
          # support (Node 21+). ts-sandbox transpiles first, so it is version-agnostic.
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ts-sandbox unit tests
        run: npm ci && npm test
        working-directory: packages/typescript/sandbox
      - name: py-sandbox unit tests
        run: python3 -m unittest discover -s tests -t .
        working-directory: py-sandbox
      - name: sdk typecheck + tests
        run: npm ci && npm run check
        working-directory: sdk

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
      
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --no-self-update
          rustup default ${{ env.RUST_VERSION }}

      - name: Install target
        if: matrix.config.target != ''
        shell: bash
        run: rustup target add --toolchain ${{ env.RUST_VERSION }} ${{ matrix.config.target }}

      - name: Install Wasm Rust target
        run: rustup target add wasm32-wasip1 wasm32-wasip2 --toolchain ${{ env.RUST_VERSION }}
      - name: Install Spin
        uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: cargo-bins/cargo-binstall@main

      - name: Install Wac and wasm-tools
        run: |
          cargo binstall wac-cli
          cargo binstall wasm-tools

      - name: Build components (ts-sandbox + bundler)
        run: spin build -c ts-sandbox -c bundler
      - name: Integration tests (bundler -> sandbox)
        # Reaches esm.sh at runtime; starts `spin up` on the trimmed test manifest,
        # runs test/integration.test.mjs, tears down.
        run: node packages/typescript/bundler/test/integration-run.mjs
