name: tests

# Unit tests and the live sandbox suites (smoke + examples, both languages) run on every PR
# and main push; `ci` is the required aggregate check. The bundler's live suites reach
# esm.sh and take longer, so they run on demand (Run workflow) or when requested by the
# release workflow. Only the bundler's compatibility reports are uploaded; the release
# workflow builds the components it publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      run-bundler:
        description: Run the live bundler integration and compatibility gates.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95"

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Guard and guard-io unit tests
        run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        with:
          # Sandbox module mocks and the SDK's native TS tests need modern Node.
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            packages/typescript/sandbox/package-lock.json
            sdk/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ts-sandbox unit tests
        run: npm ci && npm test
        working-directory: packages/typescript/sandbox
      - name: Bundler gate and report unit tests
        run: npm run test:unit
        working-directory: packages/typescript/bundler
      - name: py-sandbox unit tests
        run: python3 -m unittest discover -s tests -t .
        working-directory: py-sandbox
      - name: sdk typecheck + tests
        run: npm ci && npm run check
        working-directory: sdk

  sandboxes:
    name: sandboxes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # py-sandbox's prebuilt wasm32-wasi packages
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            packages/typescript/sandbox/package-lock.json
            packages/typescript/bundler/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust toolchain and Wasm targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update --target wasm32-wasip2
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Install Spin
        uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Bytecode Alliance tools
        uses: ./.github/actions/setup-wasm-tools
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wasm-tools-version: "1.246.1"
          wac-version: "0.12.0"
      - name: Install hurl
        env:
          HURL_VERSION: "8.0.1"
          HURL_SHA256: e76e6c0957f83f9b761416452871554d0f068384b6cd004bff82dd8795c62225
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hurl.deb" \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          echo "${HURL_SHA256}  $RUNNER_TEMP/hurl.deb" | sha256sum -c -
          sudo apt-get install -y "$RUNNER_TEMP/hurl.deb"
      - name: Build all components
        # The app manifest wires all three, so the bundler is built too; its suites run in
        # the `bundler` job.
        run: spin build
      - name: Validate components
        run: |
          wasm-tools validate dist/ts-sandbox.wasm
          wasm-tools validate dist/py-sandbox.wasm
      - name: Check the host capabilities each sandbox imports
        run: node tests/check-imports.mjs
      - name: Start the app
        run: |
          spin up --listen 127.0.0.1:3007 > "$RUNNER_TEMP/spin.log" 2>&1 &
          for _ in $(seq 60); do
            curl -s -o /dev/null http://127.0.0.1:3007/ts/run && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/spin.log"
          exit 1
      - name: Smoke tests and security gates (both sandboxes)
        run: hurl --variable base_url=http://127.0.0.1:3007 --test tests/smoke.hurl
      - name: Example programs (both sandboxes)
        run: BASE=http://127.0.0.1:3007 SHOW_RESPONSES=0 tests/run-examples.sh
      - name: Spin log
        if: always()
        run: cat "$RUNNER_TEMP/spin.log" || true

  bundler:
    name: bundler
    if: github.event_name == 'workflow_dispatch' || inputs.run-bundler == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            packages/typescript/sandbox/package-lock.json
            packages/typescript/bundler/package-lock.json
      - name: WebAssembly tool installer tests
        run: node --test .github/actions/setup-wasm-tools/install.test.mjs
      - name: Install Rust toolchain and Wasm targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update --target wasm32-wasip2
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Install Spin
        uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Bytecode Alliance tools
        uses: ./.github/actions/setup-wasm-tools
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wasm-tools-version: "1.246.1"
          wac-version: "0.12.0"
      - name: Build composed ts-sandbox and bundler
        run: spin build -c ts-sandbox -c bundler
      - name: Validate components
        run: |
          wasm-tools validate dist/ts-sandbox.wasm
          wasm-tools validate packages/typescript/bundler/dist/bundler.wasm
      - name: Bundler integration and compatibility gate
        # Starts Spin once, runs both live suites, and fails on a baseline regression.
        # The full catalog reaches esm.sh; reports are retained even on failure.
        shell: bash
        env:
          COMPAT_OUTPUT_DIR: ${{ runner.temp }}/bundler-compat
        run: npm run test:ci 2>&1 | tee "$RUNNER_TEMP/bundler-tests.log"
        working-directory: packages/typescript/bundler
      - name: Compatibility summary
        if: always()
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const root = path.join(process.env.RUNNER_TEMP, 'bundler-compat');
          const latest = path.join(root, 'latest.json');
          if (existsSync(latest)) {
            const { runDirectory } = JSON.parse(readFileSync(latest, 'utf8'));
            const gate = path.join(root, runDirectory, 'GATE.md');
            if (existsSync(gate)) process.stdout.write(readFileSync(gate, 'utf8'));
          }
          JS
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundler-test-results
          path: |
            ${{ runner.temp }}/bundler-compat/
            ${{ runner.temp }}/bundler-tests.log
          if-no-files-found: warn
          retention-days: 90

  ci:
    name: ci
    if: always()
    needs: [unit, sandboxes, bundler]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all scheduled tests to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          SANDBOXES_RESULT: ${{ needs.sandboxes.result }}
          BUNDLER_RESULT: ${{ needs.bundler.result }}
          EXPECTED_BUNDLER_RESULT: ${{ (github.event_name == 'workflow_dispatch' || inputs.run-bundler == true) && 'success' || 'skipped' }}
        run: |
          [[ "$UNIT_RESULT" == success && "$SANDBOXES_RESULT" == success && "$BUNDLER_RESULT" == "$EXPECTED_BUNDLER_RESULT" ]]
