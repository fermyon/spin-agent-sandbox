name: tests

# Two jobs: the pure-logic unit suites (no build, no server) and the live bundler
# integration (real Wasm components chained via `spin up`, reaching esm.sh). See
# ts-sandbox/bundler/test/README.md. The broad 571-library compatibility sweep lives in
# ts-sandbox/bundler/test/compat and is run manually.
on:
  push:
    branches: [main]
    paths:
      - "ts-sandbox/**"
      - "py-sandbox/**"
      - "sdk/**"
      - "spin.toml"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "ts-sandbox/**"
      - "py-sandbox/**"
      - "sdk/**"
      - "spin.toml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  unit:
    name: unit (pure logic, no server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ts-sandbox unit tests
        run: npm ci && npm test
        working-directory: ts-sandbox
      - name: py-sandbox unit tests
        run: python3 -m unittest discover -s tests -t .
        working-directory: py-sandbox
      - name: sdk typecheck + tests
        run: npm ci && npm run check
        working-directory: sdk

  integration:
    name: integration (real components)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Spin
        uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build components (ts-sandbox + bundler)
        run: spin build -c ts-sandbox -c bundler
      - name: Integration tests (bundler -> sandbox)
        # Reaches esm.sh at runtime; starts `spin up` on the trimmed test manifest,
        # runs test/integration.test.mjs, tears down.
        run: node ts-sandbox/bundler/test/integration-run.mjs
