name: Set up WebAssembly tools
description: Install pinned Bytecode Alliance wasm-tools and wac binaries for the runner OS and architecture.
inputs:
  github-token:
    description: GitHub token used to read public release metadata.
    required: true
  wasm-tools-version:
    description: wasm-tools release version, without the v prefix.
    required: true
  wac-version:
    description: wac release version, without the v prefix.
    required: true
outputs:
  wasm-tools-version:
    description: Installed wasm-tools release tag.
    value: ${{ steps.install.outputs.wasm-tools-version }}
  wac-version:
    description: Installed wac release tag.
    value: ${{ steps.install.outputs.wac-version }}
runs:
  using: composite
  steps:
    - name: Install releases
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}
        WASM_TOOLS_VERSION: ${{ inputs.wasm-tools-version }}
        WAC_VERSION: ${{ inputs.wac-version }}
      run: bash "$ACTION_PATH/install.sh"
